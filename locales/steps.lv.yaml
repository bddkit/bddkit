# Translated step descriptions. The key is the StepId variant name.
# English lives in BUILTIN_STEPS beside the pattern it describes; a key missing
# here falls back to English, so this file may lag behind newly added steps.

SetRequestHeader: iestata veidojamā pieprasījuma galveni, aizstājot iepriekšējo vērtību
AddRequestHeader: pievieno vēl vienu vērtību pieprasījuma galvenei, saglabājot esošo
SetQueryParam: iestata vaicājuma virknes parametru
SetRequestBody: iestata pieprasījuma saturu no teksta bloka zem soļa
EmptyRequestBody: notīra līdz šim sagatavoto pieprasījuma saturu
SetFormParams: nosūta zemāk esošo tabulu kā formas parametrus satura vietā
RequestPathWithMethod: izpilda pieprasījumu pret pašreizējo API ar norādīto metodi
RequestPath: izpilda GET pieprasījumu pret pašreizējo API
SignNextRequestWithHawk: paraksta nākamo pieprasījumu ar šiem Hawk akreditācijas datiem un katru tā atkārtojumu
ExpectEventually: ļauj nākamajai pārbaudei atkārtoties ar konfigurētajiem aptaujas parametriem
ExpectWithinEvery: ļauj nākamajai pārbaudei atkārtoties tik ilgi un ar šādu intervālu
ExpectWithin: ļauj nākamajai pārbaudei atkārtoties tik ilgi ar konfigurēto intervālu
ResponseCode: pārbauda pēdējās atbildes HTTP statusa kodu
ResponseBodyContainsJson: pārbauda, vai atbildes saturs ietver šo JSON — objekta apakškopa der, masīva secība netiek ņemta vērā
ResponseBodyEqualsJson: pārbauda, vai atbildes saturs precīzi sakrīt ar šo JSON, atslēga pret atslēgu un elements pret elementu
ResponseArrayLength: pārbauda, vai atbildes saturs ir norādītā garuma JSON masīvs
ResponseHeader: pārbauda, vai atbildes galvene ir tieši šī vērtība
JsonNodeExists: pārbauda, vai atbildes saturā ir mezgls šajā JSON ceļā
SetVariableGlobal: piešķir mainīgo, kas redzams visiem šī faila scenārijiem
SetVariable: piešķir mainīgo pašreizējam scenārijam
ExtractFromJsonGlobal: nolasa atbildes JSON ceļu mainīgajā, kas redzams visam failam
ExtractFromJson: nolasa atbildes JSON ceļu mainīgajā
ExtractFromCookiesGlobal: nolasa atbildes sīkdatni mainīgajā, kas redzams visam failam
ExtractFromCookies: nolasa atbildes sīkdatni mainīgajā
VariableNotEquals: pārbauda, vai mainīgais atšķiras no šīs vērtības
VariableEquals: pārbauda, vai mainīgais ir tieši šī vērtība
VariableContains: pārbauda, vai mainīgā teksts satur šo apakšvirkni
VariableNotContains: pārbauda, vai mainīgā teksts nesatur šo apakšvirkni
VariableMatches: pārbauda, vai mainīgā teksts atbilst regulārajai izteiksmei, bez piesaistes malām
VariableNotMatches: pārbauda, vai mainīgā teksts neatbilst regulārajai izteiksmei
VariableEmpty: pārbauda, vai mainīgā teksts ir tukšs vai sastāv tikai no atstarpēm
VariableContainsJson: pārbauda, vai mainīgā teksts ir JSON, kas satur šo JSON, ar tādu pašu salīdzināšanu kā atbildes saturam
VariableEqualsJson: pārbauda, vai mainīgā teksts ir JSON, kas precīzi vienāds ar šo JSON
VariableNotContainsJson: pārbauda, vai mainīgā teksts ir JSON, kas nesatur šo JSON
ExtractJsonFromVariableGlobal: nolasa JSON ceļu no mainīgā teksta mainīgajā, kas redzams visam failam
ExtractJsonFromVariable: nolasa JSON ceļu no mainīgā teksta mainīgajā
ExtractRegexFromVariableGlobal: nolasa regulārās izteiksmes pirmo tveršanas grupu no mainīgā teksta mainīgajā, kas redzams visam failam
ExtractRegexFromVariable: nolasa regulārās izteiksmes pirmo tveršanas grupu no mainīgā teksta mainīgajā
EncryptWithAes: šifrē vērtību ar AES atslēgu un saglabā rezultātu mainīgajā
UseApi: pārslēdz API resursu un tā noklusējuma galvenes līdz scenārija beigām
UseConnection: pārslēdz datubāzes savienojumu līdz scenārija beigām
DebugOn: izvada uz stderr ģenerēto SQL, tā saites un apmaiņu ar spraudņiem
DebugOff: izslēdz atkļūdošanas izvadi, kas ieslēgta agrāk scenārijā
HaveWhere: ievieto pa rindai par katru zemāk esošās tabulas rindu, kolonnas no tās galvenes
HaveWith: ievieto rindu, aizpildot obligātās kolonnas pēc tabulas shēmas
HaveMulti: ievieto rindas vairākās tabulās, zemāk esošās tabulas pirmā kolonna nosauc katru
Update: atjaunina atbilstošās rindas un saglabā to skaitu mainīgajā updated_<table>
DeleteAll: iztukšo visu tabulu — bez WHERE un neņemot vērā paralēli darbojošos failus
DeleteWhere: dzēš atbilstošās rindas un saglabā to skaitu mainīgajā deleted_<table>
ExtractFromDb: nolasa pirmās atbilstošās rindas kolonnu mainīgajā
ShouldNotHaveTable: pārbauda, ka neviena rinda neatbilst nevienai zemāk esošās tabulas rindai
ShouldNotHaveWith: pārbauda, ka nav rindas ar šādām kolonnu vērtībām
ShouldHaveTable: pārbauda, ka katrai zemāk esošās tabulas rindai atbilst kāda rinda
ShouldHaveWith: pārbauda, ka ir vismaz viena rinda ar šādām kolonnu vērtībām
CallProcedure: izsauc glabāto procedūru ar šiem argumentiem
CallFunction: izsauc funkciju un saglabā tās rezultātu mainīgajā
GetSequence: pavirza secību uz priekšu un saglabā jauno vērtību mainīgajā
Sleep: aptur scenāriju — galējs līdzeklis, parasti noder atlikta pārbaude
ShowAllVariables: izvada uz stderr visus redzamos mainīgos
ShowVariable: izvada uz stderr vienu mainīgo un kļūdu, ja tas nav iestatīts
PrintResponseHeaders: izvada uz stderr pēdējās atbildes galvenes
PrintResponseBody: izvada uz stderr pēdējās atbildes saturu ar iekrāsojumu
PrintResponseBodyAsPath: izvada uz stderr pēdējās atbildes izvēli pēc JSON ceļa vai XPath
SrpVerifierWithSalt: aprēķina SRP verifikatoru ar šo sāli mainīgajos <prefix>_salt un <prefix>_verifier
SrpVerifier: aprēķina SRP verifikatoru ar jaunu sāli mainīgajos <prefix>_salt un <prefix>_verifier
SrpStartLogin: sāk SRP pieteikšanos, saglabājot klienta vērtības <prefix>_a un <prefix>_A
SrpCompleteLogin: atbild uz servera izaicinājumu mainīgajos <prefix>_M1, <prefix>_M2 un <prefix>_sessionKey
UsePluginInstance: pārslēdz šīs grupas instanci līdz scenārija beigām
