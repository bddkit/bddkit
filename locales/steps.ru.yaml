# Translated step descriptions. The key is the StepId variant name.
# English lives in BUILTIN_STEPS beside the pattern it describes; a key missing
# here falls back to English, so this file may lag behind newly added steps.

SetRequestHeader: устанавливает заголовок собираемого запроса, заменяя прежнее значение
AddRequestHeader: добавляет ещё одно значение к заголовку запроса, сохраняя прежнее
SetQueryParam: устанавливает параметр строки запроса
SetRequestBody: задаёт тело запроса из докстринга под шагом
EmptyRequestBody: очищает собранное тело запроса
SetFormParams: отправляет таблицу ниже как form-параметры вместо тела
RequestPathWithMethod: выполняет запрос к текущему API указанным методом
RequestPath: выполняет GET-запрос к текущему API
SignNextRequestWithHawk: подписывает следующий запрос этими учётными данными Hawk и каждый его повтор
ExpectEventually: разрешает следующей проверке повторяться с настроенными параметрами опроса
ExpectWithinEvery: разрешает следующей проверке повторяться указанное время с указанным интервалом
ExpectWithin: разрешает следующей проверке повторяться указанное время с настроенным интервалом
ResponseCode: проверяет HTTP-код последнего ответа
ResponseBodyContainsJson: проверяет, что тело ответа содержит этот JSON — подмножество объекта проходит, порядок массива не важен
ResponseBodyEqualsJson: проверяет, что тело ответа в точности равно этому JSON, ключ в ключ и элемент в элемент
ResponseArrayLength: проверяет, что тело ответа — JSON-массив указанной длины
ResponseHeader: проверяет, что заголовок ответа равен ровно этому значению
JsonNodeExists: проверяет, что в теле ответа есть узел по этому JSON-пути
SetVariableGlobal: задаёт переменную, видимую всем сценариям этого файла
SetVariable: задаёт переменную для текущего сценария
ExtractFromJsonGlobal: читает JSON-путь ответа в переменную, видимую всему файлу
ExtractFromJson: читает JSON-путь ответа в переменную
ExtractFromCookiesGlobal: читает cookie ответа в переменную, видимую всему файлу
ExtractFromCookies: читает cookie ответа в переменную
VariableNotEquals: проверяет, что переменная отличается от этого значения
VariableEquals: проверяет, что переменная равна ровно этому значению
VariableContains: проверяет, что текст переменной содержит эту подстроку
VariableNotContains: проверяет, что текст переменной не содержит эту подстроку
VariableMatches: проверяет, что текст переменной совпадает с регулярным выражением, без привязки к краям
VariableNotMatches: проверяет, что текст переменной не совпадает с регулярным выражением
VariableEmpty: проверяет, что текст переменной пуст или состоит из одних пробельных символов
VariableContainsJson: проверяет, что текст переменной — JSON, содержащий этот JSON, с тем же сопоставлением, что у тела ответа
VariableEqualsJson: проверяет, что текст переменной — JSON, в точности равный этому JSON
VariableNotContainsJson: проверяет, что текст переменной — JSON, не содержащий этот JSON
ExtractJsonFromVariableGlobal: читает JSON-путь из текста переменной в переменную, видимую всему файлу
ExtractJsonFromVariable: читает JSON-путь из текста переменной в переменную
ExtractRegexFromVariableGlobal: читает первую группу захвата регулярного выражения по тексту переменной в переменную, видимую всему файлу
ExtractRegexFromVariable: читает первую группу захвата регулярного выражения по тексту переменной в переменную
EncryptWithAes: шифрует значение ключом AES и кладёт результат в переменную
UseApi: переключает API-ресурс и его заголовки по умолчанию до конца сценария
UseConnection: переключает подключение к базе до конца сценария
DebugOn: печатает в stderr сгенерированный SQL, его привязки и обмен с плагинами
DebugOff: выключает отладочный вывод, включённый ранее в сценарии
HaveWhere: вставляет по строке на каждую строку таблицы ниже, колонки берутся из её шапки
HaveWith: вставляет строку, дозаполняя обязательные колонки по схеме таблицы
HaveMulti: вставляет строки в несколько таблиц, первая колонка таблицы ниже называет каждую
Update: обновляет подходящие строки и кладёт их число в updated_<table>
DeleteAll: очищает таблицу целиком — без WHERE и без оглядки на параллельные файлы
DeleteWhere: удаляет подходящие строки и кладёт их число в deleted_<table>
ExtractFromDb: читает колонку первой подходящей строки в переменную
ShouldNotHaveTable: проверяет, что ни одна строка не подходит ни под одну строку таблицы ниже
ShouldNotHaveWith: проверяет, что нет строки с такими значениями колонок
ShouldHaveTable: проверяет, что под каждую строку таблицы ниже находится строка
ShouldHaveWith: проверяет, что есть хотя бы одна строка с такими значениями колонок
CallProcedure: вызывает хранимую процедуру с этими аргументами
CallFunction: вызывает функцию и кладёт её результат в переменную
GetSequence: сдвигает последовательность и кладёт новое значение в переменную
Sleep: приостанавливает сценарий — крайняя мера, обычно нужна отложенная проверка
ShowAllVariables: печатает в stderr все переменные в области видимости
ShowVariable: печатает в stderr одну переменную, падая, если она не задана
PrintResponseHeaders: печатает в stderr заголовки последнего ответа
PrintResponseBody: печатает в stderr тело последнего ответа с подсветкой
PrintResponseBodyAsPath: печатает в stderr выборку из последнего ответа по JSON-пути или XPath
SrpVerifierWithSalt: вычисляет SRP-верификатор с этой солью в <prefix>_salt и <prefix>_verifier
SrpVerifier: вычисляет SRP-верификатор со свежей солью в <prefix>_salt и <prefix>_verifier
SrpStartLogin: начинает SRP-вход, сохраняя клиентские значения в <prefix>_a и <prefix>_A
SrpCompleteLogin: отвечает на вызов сервера в <prefix>_M1, <prefix>_M2 и <prefix>_sessionKey
UsePluginInstance: переключает экземпляр этой группы до конца сценария
