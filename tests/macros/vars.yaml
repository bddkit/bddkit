# No `exports`: what this macro extracts survives its frame only if `global`.
- step: 'I pull the user id out of variable "{source}"'
  do:
    - extract "user.id" from variable "<<source>>" as JSON as "uid" global
    - extract "(\d+)" from variable "<<source>>" as "digits" global

# A Cucumber Expression template: optional text and an alternation (#66).
- step: 'I remember the value/text "{value}" as a (new )note'
  exports: [note]
  do:
    - set variable "note" to "<<value>>"

# A typed parameter (#66): `{code:uint}` accepts digits or a whole <<variable>>,
# and a variable's value is checked when the step runs.
- step: 'the "{path}" page answers {code:uint}'
  do:
    - I request "<<path>>"
    - the response code is <<code>>
