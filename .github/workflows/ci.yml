name: CI

# Tests run on pull requests only: `main` is protected and every change reaches
# it through a PR, so a green PR is the gate. The release workflow deliberately
# does not re-run them.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which jobs below have anything to check. A skipped job counts as
  # passed for a required status check, so a docs-only PR can still merge —
  # which `paths-ignore` on the trigger would not allow, as the check would
  # never be created. Everything not named as prose is code: a new kind of
  # file runs the tests until someone lists it here.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      installers: ${{ steps.diff.outputs.installers }}
      registry: ${{ steps.diff.outputs.registry }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "installers=true" >> "$GITHUB_OUTPUT"
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|\.claude/|.*\.md$|LICENSE|\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(install\.sh|install\.ps1|\.github/workflows/ci\.yml)$'; then
            echo "installers=true" >> "$GITHUB_OUTPUT"
          else
            echo "installers=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(plugin-registry\.yaml|\.github/scripts/(test_)?update_registry_abi\.py)$'; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"
          fi

  # The scheduled registry-abi.yml alone would never check a pull request that
  # adds a plugin (bddkit/bddkit#229): this runs the same checks, writes nothing.
  registry:
    name: plugin index
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: pip install pyyaml
      - run: python3 .github/scripts/test_update_registry_abi.py
      - run: python3 .github/scripts/update_registry_abi.py --check

  lint-install-scripts:
    name: lint install scripts
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # shellcheck ships preinstalled on the ubuntu-latest runner image.
      - name: shellcheck install.sh
        run: shellcheck install.sh
      # PSScriptAnalyzer ships preinstalled on the ubuntu-latest runner image's pwsh.
      # PSAvoidUsingWriteHost is excluded on purpose: this is a top-level script piped
      # through `irm | iex`, not a module, and Write-Host is the right call for
      # colored, unbuffered status lines during an install.
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { exit 1 }

  test:
    name: test & clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # The toolchain is pinned on purpose: on a floating `stable` every new clippy
      # lint reddens PRs that have nothing to do with the change under review.
      # rustflags is emptied so only the clippy invocation below carries -D warnings.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""

      - name: Format check
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tests/fixtures/echo-plugin/Cargo.toml
          cargo fmt --check --manifest-path tests/fixtures/worker-plugin/Cargo.toml
          cargo fmt --check --manifest-path tests/fixtures/group-plugin/Cargo.toml

      # Over-limit files are in .github/file-size-baseline.txt and may only
      # shrink; see scripts/file-budget.sh.
      - name: File size budget
        run: scripts/file-budget.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # First: a unit test that broke must report before the slower targets run.
      - name: Unit tests
        run: cargo test --locked --bin bddkit

      # Every integration target.
      - name: Integration tests
        run: cargo test --locked --test '*'

      # bddkit testing bddkit: selftest/ runs the binary on a scratch project
      # through the published `exec` plugin and reads back what it printed and
      # wrote. It is what proves masking works end to end; the Rust acceptance
      # tests remain the gate that needs no plugin download.
      - name: Self-test
        run: |
          cargo build --locked
          ./target/debug/bddkit plugin install exec
          ./target/debug/bddkit run --config selftest/bddkit.yaml --events "$RUNNER_TEMP/selftest/run.ndjson" --evidence --artifacts-dir "$RUNNER_TEMP/selftest/artifacts"

      # The stream above, as the page a person opens after a red build. Kept
      # outside the checkout, and uploaded with its artifacts; `--embed-artifacts` makes the page open on its own anyway.
      - name: Self-test report
        if: always()
        run: ./target/debug/bddkit report "$RUNNER_TEMP/selftest/run.ndjson" --embed-artifacts

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore

      - name: Package check
        run: cargo publish --dry-run --locked
