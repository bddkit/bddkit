# Mocks for examples/features/*.feature, seeded into Smocker at startup
# (docker compose up -d smocker). Format: https://smocker.dev
#
# Order matters where two mocks match the same request: Smocker tries the
# LAST registered mock first. The "/jobs/1" pair below relies on that — the
# "pending" mock is registered last, answers twice (context.times), and then
# the "done" mock above it takes over.

# --- JSON, one resource --------------------------------------------------

- request:
    method: GET
    path: /posts/1
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      {"id": 1, "userId": 1, "title": "sunt aut facere repellat provident"}

- request:
    method: GET
    path: /posts
    query_params:
      userId: "1"
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      [{"id": 1, "userId": 1, "title": "sunt aut facere repellat provident"},
       {"id": 2, "userId": 1, "title": "qui est esse"},
       {"id": 3, "userId": 1, "title": "ea molestias quasi exercitationem"}]

- request:
    method: GET
    path: /posts/999
  response:
    status: 404
    headers:
      Content-Type: application/json
    body: >
      {"error": "not found", "id": 999}

- request:
    method: POST
    path: /posts
  response:
    status: 201
    headers:
      Content-Type: application/json
      Location: /posts/101
    body: >
      {"id": 101}

- request:
    method: PUT
    path: /posts/1
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      {"id": 1, "userId": 1, "title": "replaced", "body": "replaced body"}

- request:
    method: PATCH
    path: /posts/1
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      {"id": 1, "userId": 1, "title": "patched", "body": "demo"}

- request:
    method: DELETE
    path: /posts/1
  response:
    status: 204

- request:
    method: HEAD
    path: /posts/1
  response:
    status: 200
    headers:
      Content-Type: application/json

- request:
    method: OPTIONS
    path: /posts
  response:
    status: 204
    headers:
      Allow: GET, POST, OPTIONS

# --- Nested JSON and arrays ---------------------------------------------

- request:
    method: GET
    path: /users/1
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      {"id": 1,
       "name": "Leanne Graham",
       "email": "leanne@example.com",
       "address": {"city": "Gwenborough", "geo": {"lat": "-37.3159", "lng": "81.1496"}},
       "tags": ["admin", "editor", "reader"]}

- request:
    method: GET
    path: /posts/1/comments
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      [{"id": 11, "postId": 1, "email": "eliseo@example.com", "body": "laudantium"},
       {"id": 12, "postId": 1, "email": "jayne@example.com", "body": "est natus"}]

# --- Non-JSON content types ---------------------------------------------

- request:
    method: GET
    path: /posts/1.html
  response:
    status: 200
    headers:
      Content-Type: text/html; charset=utf-8
    body: |
      <!doctype html>
      <html lang="en">
        <head><title>Post 1</title></head>
        <body><h1 id="title">sunt aut facere repellat provident</h1></body>
      </html>

- request:
    method: GET
    path: /posts/1.xml
  response:
    status: 200
    headers:
      Content-Type: application/xml
    body: |
      <?xml version="1.0" encoding="UTF-8"?>
      <post id="1" userId="1">
        <title>sunt aut facere repellat provident</title>
      </post>

- request:
    method: GET
    path: /health
  response:
    status: 200
    headers:
      Content-Type: text/plain; charset=utf-8
    body: OK

# --- Form login, cookie --------------------------------------------------

- request:
    method: POST
    path: /login
  response:
    status: 200
    headers:
      Content-Type: application/json
      Set-Cookie: session=s3cr3t-session; Path=/; HttpOnly
    body: >
      {"status": "ok", "user": "demo"}

# --- File upload: only a multipart/form-data request is accepted ---------

# The body matcher needs the text field and the file part to be there, so an
# upload that drops either fails the example.
- request:
    method: POST
    path: /documents
    headers:
      Content-Type:
        matcher: ShouldStartWith
        value: "multipart/form-data; boundary="
    body:
      matcher: ShouldMatch
      value: '(?s)name="metadata".*filename="id_front\.png"'
  response:
    status: 201
    headers:
      Content-Type: application/json
    body: >
      {"status": "stored", "documentId": "doc-42"}

# Two files under one part name.
- request:
    method: POST
    path: /documents/batch
    headers:
      Content-Type:
        matcher: ShouldStartWith
        value: "multipart/form-data; boundary="
    body:
      matcher: ShouldMatch
      value: '(?s)filename="id_front\.png".*filename="notes\.txt"'
  response:
    status: 201
    headers:
      Content-Type: application/json
    body: >
      {"stored": 2}

# --- Dynamic: echo back what was posted ---------------------------------

- request:
    method: POST
    path: /echo
  dynamic_response:
    engine: lua
    script: |
      return {
        status = 201,
        headers = { ["Content-Type"] = {"application/json"} },
        body = { id = 101, title = request.body.title },
      }

# --- A job that only finishes on the third poll --------------------------

- request:
    method: GET
    path: /jobs/1
  response:
    status: 200
    headers:
      Content-Type: application/json
    body: >
      {"id": 1, "status": "done", "result": 42}

- request:
    method: GET
    path: /jobs/1
  context:
    times: 2
  response:
    status: 202
    headers:
      Content-Type: application/json
    body: >
      {"id": 1, "status": "pending"}
