- step: 'I create a post with title "{title}"'
  exports: [lastPostId]
  do:
    - the "Content-Type" request header is "application/json"
    - the request body is: |
        {"title": "<<title>>", "body": "demo", "userId": 1}
    - I request "/posts" using HTTP POST
    - the response code is 201
    - extract "id" from JSON as "lastPostId"

# Extracts what it needs from the response and publishes it under a name the
# caller can read; everything else it sets stays inside the macro's frame.
- step: 'I log in as "{user}" with password "{password}"'
  exports: [sessionId]
  do:
    - the "Content-Type" request header is "application/json"
    - the request body is: |
        {"user": "<<user>>", "password": "<<password>>"}
    - I request "/login" using HTTP POST
    - the response code is 200
    - extract "session" from cookies as "sessionId"

# Macros call macros (up to depth 16). Both results are re-exported, because
# an export only reaches the frame one level up.
- step: 'I publish a post titled "{title}" as "{user}"'
  exports: [sessionId, lastPostId]
  do:
    - I log in as "<<user>>" with password "s3cr3t"
    - the "Authorization" request header is "Bearer <<sessionId>>"
    - I create a post with title "<<title>>"

# A Cucumber Expression: `post/article` is an alternation and `(main )` optional
# text, in separate words because an alternation spans the whole word.
- step: 'I note the post/article (main )title "{title}"'
  exports: [notedTitle]
  do:
    - set variable "notedTitle" to "<<title>>"

# `{code:uint}` is a typed parameter: it accepts digits or a whole <<variable>>,
# and a variable's value is checked against the type when the step runs.
- step: 'the "{path}" page answers {code:uint}'
  do:
    - I request "<<path>>"
    - the response code is <<code>>
