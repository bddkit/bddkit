[package]
name = "bddkit"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "Gherkin acceptance testing for backend services: one binary drives the HTTP API and the resources behind it"
license = "Apache-2.0"
repository = "https://github.com/sergeym/bddkit"
homepage = "https://github.com/sergeym/bddkit"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "acceptance", "api"]
categories = ["development-tools::testing", "command-line-utilities"]
exclude = [
    "/.github",
    "/.idea",
    "/tests",
    "/examples",
    "/docker-compose.yml",
    "/CLAUDE.md",
    "/AGENTS.md",
]

[[bin]]
name = "bddkit"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
gherkin = "0.16"
hmac = "0.12"
libloading = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
regex = "1.13"
clap = { version = "4.6", features = ["derive"] }
uuid = { version = "1.24", features = ["v7"] }
url = "2"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql"] }
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
dotenvy = "0.15"
num-bigint = "0.4"
sha2 = "0.10"
sha1 = "0.10"
getrandom = "0.3"
scraper = "0.27.0"

[dev-dependencies]
axum = "0.8"

# Release artifacts ship without debug symbols: smaller downloads, same behavior.
[profile.release]
strip = "symbols"
